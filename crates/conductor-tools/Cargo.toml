[package]
name = "conductor-tools"
description = "Agent tools for Conductor: process execution, Git, checkpoints, MCP, skills, plugins, themes, Environment Doctor, Caveman, tunnels"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
conductor-context.workspace = true
conductor-security.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "sync", "macros", "rt", "fs"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
which.workspace = true
reqwest.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
