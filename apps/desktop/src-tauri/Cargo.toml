[package]
name = "conductor-app"
description = "Conductor desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "conductor-app"
path = "src/main.rs"

[dependencies]
conductor-context.workspace = true
conductor-core.workspace = true
conductor-engine.workspace = true
conductor-orchestrator.workspace = true
conductor-remote.workspace = true
conductor-security.workspace = true
conductor-tools.workspace = true
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
url = "2"
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
