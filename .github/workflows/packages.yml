name: Development packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build unsigned development packages
        uses: tauri-apps/tauri-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --config ../../.github/unsigned-tauri.json -- --locked
      - name: Record package hashes and provenance
        run: node scripts/release-evidence.mjs target/${{ matrix.target }}/release/bundle
        env:
          CONDUCTOR_PACKAGE_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: conductor-development-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle
            CHANGELOG.md
            LICENSE
            Cargo.lock
            package-lock.json
